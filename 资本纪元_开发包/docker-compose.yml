services:
  postgres:
    image: postgres:16
    container_name: capital_epoch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: capital_epoch
      POSTGRES_USER: capital_epoch
      POSTGRES_PASSWORD: capital_epoch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
